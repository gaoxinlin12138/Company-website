<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瓷白＋浅青绿 · 网站实际效果</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8f5;color:#17343a;font:16px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1320px;margin:auto;padding:40px 24px}h1{font-size:30px;margin:0 0 12px}p{color:#526d65;max-width:75ch}nav{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}a{color:#37675d;text-underline-offset:5px}section{margin:48px 0}h2{font-size:24px}figure{margin:0}img{display:block;max-width:100%;height:auto;border:1px solid #cfdfd7}figcaption{color:#526d65;margin:10px 0}.pair{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px;align-items:start}a:focus-visible{outline:3px solid #37675d;outline-offset:5px}@media(max-width:720px){.pair{grid-template-columns:1fr}.pair figure:last-child{max-width:390px}main{padding:24px 16px}}
</style></head><body><main><h1>瓷白＋浅青绿 · 网站实际效果</h1><p>当前网站的浏览器截图，保留现有页面结构、文字、产品实拍和交互。导航、按钮、页面背景及管理后台使用统一的新配色；场景配图为示意素材。点击截图可查看原尺寸。</p><nav><a href="http://127.0.0.1:8126/">打开本地网站</a><a href="#home">首页</a><a href="#products">产品中心</a><a href="#about">关于我们</a><a href="#news">新闻动态</a><a href="#cases">案例展示</a><a href="#contact">联系我们</a><a href="#admin">后台</a></nav><div id="previews"></div>
<script>
const labels={home:'首页',products:'产品中心',about:'关于我们',news:'新闻动态',cases:'案例展示',contact:'联系我们',admin:'后台管理'};
document.getElementById('previews').innerHTML=Object.entries(labels).map(([key,label])=>`<section id="${key}"><h2>${label}</h2><div class="pair">${['desktop','mobile'].map(device=>`<figure><a href="previews/${key}-${device}.jpg" target="_blank"><img src="previews/${key}-${device}.jpg" alt="${label}${device==='desktop'?'电脑端':'手机端'}实际截图" loading="lazy"></a><figcaption>${device==='desktop'?'电脑端 · 1280 像素视口':'手机端 · 390 像素视口'}</figcaption></figure>`).join('')}</div></section>`).join('')+`<section><h2>现有交互与场景展示</h2>${['home-gallery','cases-story','mobile-menu'].map(key=>`<figure><a href="previews/${key}.jpg" target="_blank"><img src="previews/${key}.jpg" alt="${key}真实页面截图" loading="lazy"></a></figure>`).join('')}</section>`;
</script></main></body></html>
